<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pattern — Breadcrumb</title>
  <link rel="stylesheet" href="/import.css" />
  <link rel="stylesheet" href="/patterns/patterns.css" />
  <link rel="stylesheet" href="/patterns/demo/pattern-demo.css" />
</head>
<body class="pattern-demo">
  <div class="pattern-demo__body page-container">
    <h1>Breadcrumb Pattern</h1>

    <section class="pattern-demo__section">
      <nav class="breadcrumb" aria-label="현재 위치">
        <ol class="breadcrumb__list">
          <li class="breadcrumb__item"><a class="breadcrumb__link" href="#">Home</a></li>
          <li class="breadcrumb__item"><a class="breadcrumb__link" href="#">Service</a></li>
          <li class="breadcrumb__item" aria-current="page">Current Page</li>
        </ol>
      </nav>
    </section>
  </div>
</body>
</html>
