<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pattern — Site Footer</title>
  <link rel="stylesheet" href="/import.css" />
  <link rel="stylesheet" href="/patterns/patterns.css" />
  <link rel="stylesheet" href="/patterns/demo/pattern-demo.css" />
</head>
<body class="pattern-demo">
  <div class="pattern-demo__body page-container">
    <h1>Site Footer Pattern</h1>
    <p class="pattern-demo__desc">Footer nav/info/copyright = internal elements · Family Site = native select</p>

    <section class="pattern-demo__section">
      <div class="pattern-demo__frame pattern-demo__frame--flush">
        <footer class="site-footer">
          <div class="site-footer__inner page-container">
            <div class="site-footer__top">
              <div class="site-footer__brand">Logo</div>
              <div>
                <ul class="site-footer__nav-list">
                  <li>
                    <div class="site-footer__nav-group-title">Navigation</div>
                    <ul class="site-footer__nav-links">
                      <li><a href="#">Menu 1</a></li>
                      <li><a href="#">Menu 2</a></li>
                    </ul>
                  </li>
                  <li>
                    <div class="site-footer__nav-group-title">Policy</div>
                    <ul class="site-footer__nav-links">
                      <li><a href="#">Terms</a></li>
                      <li><a href="#">Privacy</a></li>
                    </ul>
                  </li>
                </ul>
              </div>
            </div>
            <div class="site-footer__utility">
              <select class="select-field__control site-footer__family-site" aria-label="Related site">
                <option>Related Site</option>
                <option>Site A</option>
                <option>Site B</option>
              </select>
            </div>
            <div class="site-footer__info">Company Info · Contact · Address placeholder</div>
            <div class="site-footer__copyright">© Company. All rights reserved.</div>
          </div>
        </footer>
      </div>
    </section>
  </div>
</body>
</html>
