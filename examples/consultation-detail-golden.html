<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>상담사례 상세 (golden include)</title>
  <link rel="stylesheet" href="/import.css">
  <script defer src="/import.js"></script>
  <script defer src="/common.js"></script>
</head>
<body>
  <div data-include-path="/svg-symbols.html"></div>

  <div class="page-layout">
    <div data-include-path="/patterns/gnb.html"></div>

    <div data-include-path="/components/back-to-list.html" data-prop-label="목록" data-prop-href="#"></div>

    <div class="page-layout__page-inner page-layout--content">
      <div class="detail-view-container">
        <div class="page-inner__inner">
          <div class="detail-view__content">
            <div data-include-path="/components/detail-content-header.html"
              data-prop-badge1="온라인상담"
              data-prop-badge2="법률/법무"
              data-prop-badge3="부동산"
              data-prop-title="부동산 관련 문의 입니다."
              data-prop-meta1="작성일 : 2025.12.10(수)"
              data-prop-meta2="작성자 : 김*재"
              data-prop-meta3="조회수 : 4"
              data-prop-like-count="1"></div>

            <div class="detail-view--content-body">
              <div data-include-path="/components/question-area.html"
                data-prop-body-html="제가 가지고 있는 오래된 빌라가 재건축이 들어가게되었습니다. 법적으로 이사비용과 중개수수료를 모두 부담하는게 맞는 건지 조언 부탁드립니다."></div>

              <div data-include-path="/components/answer-area.html"
                data-prop-body-html="안녕하세요. 답변드립니다.<br/><br/>1. 기존 계약서 내용대로 하여야 해요.<br/>2. 특약이 있으면 특약내용대로 하시면 돼요.<br/>3. 원칙적으로 세입자가 이주비용을 부담해요."
                data-prop-tag1="# 부동산"
                data-prop-tag2="# 매매"></div>

              <div class="line-divider"></div>

              <div data-include-path="/components/advisor-profile.html"
                data-prop-image-src="/assets/img/pages/contents/advisor-img-03.png"
                data-prop-name="나영은 자문위원"
                data-prop-field="경영컨설팅"
                data-prop-region="서울"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div data-include-path="/patterns/footer.html"></div>
  </div>
</body>
</html>
