<li class="terms-area__detail-item">
  <label class="ui-checkbox">
    <input class="ui-checkbox__input" type="checkbox" id="{id}" />
    <span class="ui-checkbox__control" aria-hidden="true"></span>
    <span class="ui-checkbox__label">{label}</span>
  </label>
  <a href="{href}" aria-label="상세 보기">
    <svg class="icon icon--20" aria-hidden="true"><use href="#icon-chevron-right"></use></svg>
  </a>
</li>
