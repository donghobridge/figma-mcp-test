<div class="radio__wrapper radio__wrapper--md radio__wrapper--with-input" data-js="radio">
  <input class="radio__input" type="radio" name="{name}" id="{id}"{checkedAttr} />
  <label class="radio__label" for="{id}">{label}</label>
  <div class="input input--md radio__extra-input">
    <input
      type="text"
      placeholder="{extraPlaceholder}"
      value="{extraValue}"
      aria-label="{extraLabel}"
      {disabledAttr}
    />
  </div>
</div>
