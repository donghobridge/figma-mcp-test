<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dialog</title>
  <link rel="stylesheet" href="/import.css" />
  <style>
    body { padding: 4rem 2.4rem; background: var(--surface-default); color: var(--text-default); font-family: var(--font-family, var(--font-family-base)); }
  </style>
</head>
<body>
  <h1>Dialog</h1>
  <p>Native <code>&lt;dialog&gt;</code> + Focus Trap + Scroll Lock + Escape</p>

  <button type="button" class="button button--primary button--md" id="open-dialog">Open Dialog</button>

  <dialog class="dialog dialog--md" id="demo-dialog" data-state="closed" aria-labelledby="dialog-title">
    <div class="dialog__panel">
      <div class="dialog__header">
        <h2 class="dialog__title" id="dialog-title">Dialog Title</h2>
        <button type="button" class="button button--text button--sm" data-dialog-close aria-label="닫기">×</button>
      </div>
      <div class="dialog__body">
        <p>Headless: <code>createDialog()</code> — Escape, backdrop click(cancel), focus trap, scroll lock.</p>
      </div>
      <div class="dialog__footer">
        <button type="button" class="button button--secondary button--md" data-dialog-close>Cancel</button>
        <button type="button" class="button button--primary button--md" data-dialog-close>Confirm</button>
      </div>
    </div>
  </dialog>

  <script type="module">
    import { createDialog } from '/headless/controllers/dialog.js';

    const dialogEl = document.getElementById('demo-dialog');
    const trigger = document.getElementById('open-dialog');
    const dialog = createDialog(dialogEl);

    trigger.addEventListener('click', () => dialog.open(trigger));
  </script>
</body>
</html>
