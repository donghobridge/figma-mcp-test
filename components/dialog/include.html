<dialog class="dialog dialog--md {variantClass}" data-state="closed" aria-labelledby="{titleId}">
  <div class="dialog__panel">
    <div class="dialog__header">
      <h2 class="dialog__title" id="{titleId}">{title}</h2>
    </div>
    <div class="dialog__body">{bodyHtml}</div>
    <div class="dialog__footer">{footerHtml}</div>
  </div>
</dialog>
