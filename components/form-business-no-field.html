<div class="input-field {variantClass}">
  <label class="input-field__label">{label}</label>
  <div class="input-group input-group--split" data-js="inputGroup">
    <div class="input input--lg">
      <input type="text" inputmode="numeric" placeholder="{part1Placeholder}" value="{part1Value}" aria-label="사업자번호 앞자리" maxlength="3" />
    </div>
    <span class="input-group__addon">-</span>
    <div class="input input--lg">
      <input type="text" inputmode="numeric" placeholder="{part2Placeholder}" value="{part2Value}" aria-label="사업자번호 중간자리" maxlength="2" />
    </div>
    <span class="input-group__addon">-</span>
    <div class="input input--lg">
      <input type="text" inputmode="numeric" placeholder="{part3Placeholder}" value="{part3Value}" aria-label="사업자번호 뒷자리" maxlength="5" />
    </div>
  </div>
</div>
