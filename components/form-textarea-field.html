<div class="input-field {variantClass}">
  <label class="input-field__label {requiredClass}">{label}</label>
  <div class="input-group" data-js="inputGroup">
    <div class="input input--lg">
      <textarea placeholder="{placeholder}" rows="{rows}" maxlength="{maxLength}">{value}</textarea>
    </div>
  </div>
  <p class="input-field__msg">{helper}</p>
</div>
