<label class="selectable-card selectable-card--md {variantClass}">
  <input type="checkbox" class="selectable-card__input" {checkedAttr} />
  <span class="selectable-card__surface">
    <span class="selectable-card__header">
      <span class="selectable-card__label">{label}</span>
    </span>
    <span class="selectable-card__description">{description}</span>
  </span>
</label>
