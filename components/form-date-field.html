<div class="input-field {variantClass}">
  <label class="input-field__label">{label}</label>
  <div class="input-group input-group--split" data-js="inputGroup">
    <div class="input input--lg">
      <input type="text" placeholder="년" value="{yearValue}" aria-label="연도" maxlength="4" />
    </div>
    <span class="input-group__addon">년</span>
    <div class="input input--lg">
      <input type="text" placeholder="월" value="{monthValue}" aria-label="월" maxlength="2" />
    </div>
    <span class="input-group__addon">월</span>
    <div class="input input--lg">
      <input type="text" placeholder="일" value="{dayValue}" aria-label="일" maxlength="2" />
    </div>
    <span class="input-group__addon">일</span>
  </div>
</div>
