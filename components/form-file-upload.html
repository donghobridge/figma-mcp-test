<div class="input-field {variantClass}">
  <label class="input-field__label">{label}</label>
  <div class="input-group" data-js="inputGroup">
    <div class="input input--lg only-pc">
      <input type="text" placeholder="{placeholder}" readonly value="{fileName}" />
    </div>
    <button type="button" class="btn btn--tertiary btn--lg w-full-mo" data-js="button">
      <span class="btn__label">{buttonLabel}</span>
    </button>
  </div>
  <p class="input-field__msg">{helper}</p>
  <ul class="file-list" data-js="fileList" aria-label="첨부된 파일 목록">
    {filesHtml}
  </ul>
</div>
