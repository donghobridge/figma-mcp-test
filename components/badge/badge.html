<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Badge</title>
  <link rel="stylesheet" href="/import.css" />
  <style>
    body { padding: 4rem 2.4rem; background: var(--surface-default); color: var(--text-default); font-family: var(--font-family, var(--font-family-base)); }
    .demo-section { margin-bottom: 2.4rem; }
    .demo-label { margin-bottom: 1.2rem; color: var(--text-subtle); font-size: var(--font-body-small); }
    .demo-row { display: flex; flex-wrap: wrap; gap: 1.2rem; }
  </style>
</head>
<body>
  <h1>Badge</h1>
  <section class="demo-section">
    <div class="demo-label">Medium — all semantic variants</div>
    <div class="demo-row">
      <span class="badge badge--neutral badge--md">Neutral</span>
      <span class="badge badge--primary badge--md">Primary</span>
      <span class="badge badge--info badge--md">Info</span>
      <span class="badge badge--success badge--md">Success</span>
      <span class="badge badge--warning badge--md">Warning</span>
      <span class="badge badge--error badge--md">Error</span>
    </div>
  </section>
  <section class="demo-section">
    <div class="demo-label">Small — all semantic variants</div>
    <div class="demo-row">
      <span class="badge badge--neutral badge--sm">Neutral</span>
      <span class="badge badge--primary badge--sm">Primary</span>
      <span class="badge badge--info badge--sm">Info</span>
      <span class="badge badge--success badge--sm">Success</span>
      <span class="badge badge--warning badge--sm">Warning</span>
      <span class="badge badge--error badge--sm">Error</span>
    </div>
  </section>
</body>
</html>
