<nav class="pagination {variantClass}" aria-label="페이지네이션">
  <ul class="pagination__list">
    <li><button type="button" class="pagination__item pagination__item--prev">{prevLabel}</button></li>
    <li><a href="{page1Href}" class="pagination__item pagination__item--current" aria-current="page">{page1}</a></li>
    <li><a href="{page2Href}" class="pagination__item">{page2}</a></li>
    <li><a href="{page3Href}" class="pagination__item">{page3}</a></li>
    <li><button type="button" class="pagination__item pagination__item--next">{nextLabel}</button></li>
  </ul>
</nav>
