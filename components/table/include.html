<div class="table-wrapper">
  <table class="table {variantClass}">
    <caption class="table__caption">{caption}</caption>
    <thead class="table__head">
      <tr class="table__row">
        <th scope="col" class="table__cell">{col1}</th>
        <th scope="col" class="table__cell">{col2}</th>
        <th scope="col" class="table__cell">{col3}</th>
      </tr>
    </thead>
    <tbody class="table__body">{bodyHtml}</tbody>
  </table>
</div>
