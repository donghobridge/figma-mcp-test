<header class="portal-case-header {variantClass}">
  <div class="portal-case-header__badges">
    <span class="portal-badge portal-badge--info">{badge1}</span>
    <span class="portal-badge portal-badge--neutral">{badge2}</span>
  </div>
  <h1 class="portal-case-header__title"><span class="portal-case-header__status">{status}</span>{title}</h1>
  <time class="portal-case-header__date">{date}</time>
</header>
