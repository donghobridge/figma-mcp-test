<label class="check check--square check--sm {variantClass}" data-js="check">
  <input class="check__input" type="checkbox" name="{name}" value="{value}" />
  <svg class="icon icon--checkbox" aria-hidden="true">
    <use href="#icon-checkbox-square"></use>
  </svg>
  <span class="check__label">{label}</span>
</label>
