<div class="action-box {variantClass}">
  <div class="action-box__body">
    <div class="terms-area">
      <label class="check check--box check--lg" data-js="check">
        <input class="check__input" type="checkbox" />
        <svg class="icon icon--checkbox" aria-hidden="true">
          <use href="#icon-checkbox"></use>
        </svg>
        <span class="check__label">{allLabel}</span>
      </label>
      <ul class="terms-area__detail-list">
        {itemsHtml}
      </ul>
      <div class="content-box__text-sub">
        <p class="bullet-item">{helper}</p>
      </div>
    </div>
  </div>
</div>
