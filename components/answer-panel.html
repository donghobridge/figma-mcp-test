<section class="portal-answer {variantClass}">
  <h2 class="portal-answer__title">{title}</h2>
  <div class="portal-answer__divider"></div>
  <div class="portal-answer__notice">
    <strong>{noticeTitle}</strong>
    <span>{noticeMessage}</span>
    <time>{noticeDate}</time>
  </div>
  <dl class="portal-answer__costs">
    <div><dt>{costLabel1}</dt><dd>{costValue1}</dd></div>
    <div><dt>{costLabel2}</dt><dd>{costValue2}</dd></div>
  </dl>
  <div class="portal-answer__body">{description}</div>
  <div class="portal-tag-list" aria-label="관련 태그">
    <span>{tag1}</span>
    <span>{tag2}</span>
  </div>
</section>
