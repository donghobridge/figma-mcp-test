<div class="{variantClass}">
  <div class="answer-warning">
    <div class="answer-warning__content">
      <div class="answer-warning__label">{noticeTitle}</div>
      <div class="answer-warning__text">
        <p>{noticeMessage}</p>
      </div>
    </div>
    <div class="answer-warning__date">{noticeDate}</div>
  </div>
  <div class="answer-area">
    <b>A</b>
    <div class="answer-area__detail">
      <div class="meta-list">
        <div class="meta-item">
          <span class="meta">{costLabel1}</span>
          <span class="meta">{costValue1}</span>
        </div>
        <div class="meta-item">
          <span class="meta">{costLabel2}</span>
          <span class="meta">{costValue2}</span>
        </div>
      </div>
      <p class="detail-text">{description}</p>
      <div class="tag-list" aria-label="관련 태그">
        <button type="button" class="tag tag--md">{tag1}</button>
        <button type="button" class="tag tag--md">{tag2}</button>
      </div>
    </div>
  </div>
</div>
