<div class="form-field {variantClass}">
  <label class="form-field__label" for="{inputId}">{label}</label>
  <div class="form-field__control">
    <input id="{inputId}" type="text" class="input input--md" placeholder="{placeholder}" value="{value}" />
  </div>
  <p class="form-field__helper">{helper}</p>
</div>
