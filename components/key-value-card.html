<section class="action-box__body {variantClass}">
  <div class="confirm-list">
    <div class="confirm-list__comfirm-item">
      <div class="comfirm-item__head">
        <div class="comfirm-item__head__title">
          <svg class="icon" aria-hidden="true"><use href="#icon-document"></use></svg>
          {title}
        </div>
      </div>
      <div class="comfirm-item__body">
        <div class="table" role="table" aria-label="{title}">
          <div class="table__body">
            <div class="table__row"><div class="table__header">{label1}</div><div class="table__cell">{value1}</div></div>
            <div class="table__row"><div class="table__header">{label2}</div><div class="table__cell">{value2}</div></div>
            <div class="table__row"><div class="table__header">{label3}</div><div class="table__cell">{value3}</div></div>
            <div class="table__row"><div class="table__header">{label4}</div><div class="table__cell">{value4}</div></div>
            <div class="table__row"><div class="table__header">{label5}</div><div class="table__cell">{value5}</div></div>
            <div class="table__row"><div class="table__header">{label6}</div><div class="table__cell">{value6}</div></div>
            <div class="table__row"><div class="table__header">{label7}</div><div class="table__cell">{value7}</div></div>
            <div class="table__row"><div class="table__header">{label8}</div><div class="table__cell">{value8}</div></div>
            <div class="table__row"><div class="table__header">{label9}</div><div class="table__cell">{value9}</div></div>
            <div class="table__row"><div class="table__header">{label10}</div><div class="table__cell">{value10}</div></div>
            <div class="table__row"><div class="table__header">{label11}</div><div class="table__cell">{value11}</div></div>
            <div class="table__row"><div class="table__header">{label12}</div><div class="table__cell">{value12}</div></div>
            <div class="table__row"><div class="table__header">{label13}</div><div class="table__cell">{value13}</div></div>
            <div class="table__row"><div class="table__header">{label14}</div><div class="table__cell">{value14}</div></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
