<section class="ui-kv-card {variantClass}">
  <header class="ui-kv-card__head">
    <span class="ui-kv-card__icon" aria-hidden="true"></span>
    <div class="ui-kv-card__titles">
      <small>{eyebrow}</small>
      <h3>{title}</h3>
    </div>
  </header>
  <dl>
    <div><dt>{label1}</dt><dd>{value1}</dd></div>
    <div><dt>{label2}</dt><dd>{value2}</dd></div>
    <div><dt>{label3}</dt><dd>{value3}</dd></div>
    <div><dt>{label4}</dt><dd>{value4}</dd></div>
    <div><dt>{label5}</dt><dd>{value5}</dd></div>
    <div><dt>{label6}</dt><dd>{value6}</dd></div>
    <div><dt>{label7}</dt><dd>{value7}</dd></div>
    <div><dt>{label8}</dt><dd>{value8}</dd></div>
    <div><dt>{label9}</dt><dd>{value9}</dd></div>
    <div><dt>{label10}</dt><dd>{value10}</dd></div>
    <div><dt>{label11}</dt><dd>{value11}</dd></div>
    <div><dt>{label12}</dt><dd>{value12}</dd></div>
  </dl>
</section>
