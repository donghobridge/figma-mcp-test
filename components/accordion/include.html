<div class="accordion {variantClass}">
  <div class="accordion__item">
    <button type="button" class="accordion__trigger" aria-expanded="false" aria-controls="{panelId}">
      {title}
      <span class="accordion__icon" aria-hidden="true"></span>
    </button>
    <div class="accordion__panel" id="{panelId}" hidden>{contentHtml}</div>
  </div>
</div>
