<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tooltip</title>
  <link rel="stylesheet" href="/import.css" />
  <style>
    body { padding: 4rem 2.4rem; background: var(--surface-default); color: var(--text-default); font-family: var(--font-family, var(--font-family-base)); }
    .demo-stack { display: grid; gap: 2.4rem; max-width: 32rem; }
    .demo-note { margin-bottom: 2rem; color: var(--text-subtle); font-size: var(--font-body-small); }
  </style>
</head>
<body>
  <h1>Tooltip</h1>
  <p class="demo-note">짧은 non-interactive 보조 설명. Close button / 복잡한 콘텐츠 → <a href="/components/popover/popover.html">Popover</a></p>

  <div class="demo-stack">
    <div class="tooltip" data-state="open" role="tooltip">
      <span class="tooltip__title">짧은 Tooltip</span>
    </div>

    <div class="tooltip tooltip--info" data-state="open" role="tooltip">
      <span class="tooltip__title">Info Tooltip</span>
      <span class="tooltip__content">서브 텍스트</span>
    </div>
  </div>
</body>
</html>
