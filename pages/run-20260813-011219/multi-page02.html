<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>multi-page02</title>
  <link rel="stylesheet" href="/import.css">
  <script defer src="/import.js"></script>
  <script defer src="/common.js"></script>
</head>
<body>
  <div data-include-path="/svg-symbols.html"></div>
  <div class="page-layout">
    <div data-include-path="/patterns/portal-header.html"></div>


    <div class="page-layout__page-inner page-layout--content">
      <div class="detail-view-container">
        <div class="page-inner__inner">
          <div class="detail-view__content">
<!-- SectionHeading: SectionHeading -->
<div data-include-path="/components/section-heading.html" data-prop-title="대출상환 신청"></div>

<!-- CaseHeader -->
<div data-include-path="/components/case-header.html"></div>
            <div class="detail-view--content-body">
<!-- GuideAccordion: GuideAccordion -->
<div data-include-path="/components/guide-accordion.html" data-prop-title="유의사항"></div>

<!-- QuestionContent -->
<div data-include-path="/components/question-content.html"></div>

<!-- AnswerPanel -->
<div data-include-path="/components/answer-panel.html" data-prop-cost-value1="1,000,000원" data-prop-cost-value2="1,000,000원"></div>

<!-- SummaryBar: SummaryBar -->
<div data-include-path="/components/summary-bar.html" data-prop-label1="현재 대출잔액" data-prop-value1="1,000,000원" data-prop-label2="상환금액" data-prop-value2="600,000원" data-prop-label3="최종 대출잔액" data-prop-value3="400,000원"></div>

<!-- KeyValueCard: KeyValueCard -->
<div data-include-path="/components/key-value-card.html" data-prop-title="신청내역" data-prop-label1="상환방법" data-prop-label2="대출잔액" data-prop-label3="상환금액" data-prop-label4="상환신청일" data-prop-label5="상환합계금" data-prop-label6="이자계산일수" data-prop-label7="대출이자율" data-prop-label8="이자납부주기" data-prop-label9="상환회차" data-prop-label10="이체은행" data-prop-label11="계좌번호"></div>

<!-- FormCard: FormCard -->
<div data-include-path="/components/form-card.html" data-prop-body-html="&lt;!-- ApplicationDateCard: ApplicationDateCard --&gt;&#10;&lt;div data-include-path=&quot;/components/application-date-card.html&quot; data-prop-label=&quot;신청일&quot; data-prop-date=&quot;2025년 12월 09일&quot;&gt;&lt;/div&gt;&#10;" data-prop-footer-html="&lt;!-- FormButtonGroup: FormButtonGroup --&gt;&#10;&lt;div data-include-path=&quot;/components/form-button-group.html&quot; data-prop-secondary-label=&quot;이전&quot; data-prop-secondary-href=&quot;#&quot; data-prop-primary-label=&quot;신청하기&quot; data-prop-primary-href=&quot;#&quot;&gt;&lt;/div&gt;&#10;"></div>
            </div>
          </div>
          <div class="action-button-list" style="margin-top:24px;justify-content:center;">

          </div>
        </div>
      </div>
    </div>

    <div data-include-path="/patterns/portal-footer.html"></div>
  </div>

</html>
