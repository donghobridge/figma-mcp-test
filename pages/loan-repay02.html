이사 계약서를 보내온 상태입니다. 법적으로 제가 이사비용과 중개수수료를 모두 부담하는게 맞는 건지 그리고 어떻게 대처하는게 현명한 건지 알고싶습니다.  일단 도의적 차원에서 일부는 부담하려 하는데 막무가네로 모두 부담을 하라고 하니 법적인 부분에서 어찌 처리하는게 맞는지 조언 부탁드립니다."></div>
